plugins {
    id 'java'
    id 'application'
}

version = '0.29.1'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-extras:3.5.4'
    implementation 'net.java.dev.jna:jna-platform:5.15.0'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(24) }
}

application {
    mainClass = 'org.newpipe.desktop.App'
}

tasks.named('run') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // development runs use their own data folder, never the real one in AppData
    systemProperty 'newpipe.data', layout.buildDirectory.dir('testdata').get().asFile.absolutePath
    // developer aids: -Pnscript=<scenario file>  -Pmpvlog=<mpv log file>
    if (project.hasProperty('nscript')) systemProperty 'newpipe.script', project.property('nscript')
    if (project.hasProperty('mpvlog')) systemProperty 'newpipe.mpvlog', project.property('mpvlog')
}

// Writes build/app.ico from the logo (used by build-windows.ps1 / jpackage)
tasks.register('makeIcon', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.newpipe.desktop.IconTool'
    args 'build/app.ico'
}

// Collects the application jar and its dependencies for jpackage
tasks.register('packageInput', Copy) {
    dependsOn jar
    from jar
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('package-input')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
